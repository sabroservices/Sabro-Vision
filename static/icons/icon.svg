<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="satGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cffafe" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square App Tile -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="#03060d" />
  <rect x="24" y="24" width="464" height="464" rx="102" fill="url(#bgGrad)" />
  <circle cx="256" cy="180" r="200" fill="url(#glowGrad)" />

  <!-- Television / Satellite Stream Graphic -->
  <g transform="translate(106, 96)" fill="url(#satGrad)">
    <!-- Satellite Dish Body -->
    <path d="M 150 40 C 210 40 260 90 260 150 C 260 210 210 260 150 260 C 120 260 93 248 74 229 L 226 77 C 205 54 179 40 150 40 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="150" cy="150" r="14" fill="#06b6d4" />
    <!-- Receiver Arm -->
    <line x1="150" y1="150" x2="225" y2="75" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <circle cx="230" cy="70" r="16" fill="#22d3ee" />
    <!-- Broadcast Waves -->
    <path d="M 235 45 C 270 70 290 110 290 155" stroke="#22d3ee" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 255 25 C 300 60 325 110 325 165" stroke="#67e8f9" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Brand Label: SABRO VISION -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">SABRO VISION</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#a5f3fc" text-anchor="middle" letter-spacing="3">FIBER ULTRA HD</text>
</svg>
