{% extends "base.html" %}

{% block title %}{{ code }} {{ title }} - {{ settings.platform_name }}{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center py-12 px-4">
    <div class="cinema-glass-card rounded-3xl p-8 sm:p-10 max-w-md w-full text-center border border-white/[0.1] shadow-2xl relative overflow-hidden">
        <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-56 h-56 bg-brand-500/15 rounded-full blur-3xl pointer-events-none"></div>

        <div class="relative z-10 space-y-4">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600/20 to-indigo-600/20 border border-cyan-500/30 text-cyan-400 font-mono text-2xl font-black">
                {{ code }}
            </div>

            <h1 class="text-2xl font-black text-white tracking-tight">{{ title }}</h1>
            <p class="text-xs text-slate-400 leading-relaxed">{{ message }}</p>

            <div class="pt-4 flex flex-col sm:flex-row gap-3 justify-center">
                <a href="{{ url_for('index') }}" class="px-5 py-3 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold text-xs shadow-lg shadow-brand-500/25 flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-house"></i>
                    <span>Go to Home</span>
                </a>
                <a href="{{ url_for('gatekeeper') }}" class="px-5 py-3 rounded-xl bg-obsidian-900 hover:bg-obsidian-800 text-slate-200 border border-white/[0.1] font-bold text-xs flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-right-to-bracket text-cyan-400"></i>
                    <span>Direct Sign In</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
